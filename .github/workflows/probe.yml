name: Probe nrsr.sk
# Manual: downloads sample HTML from nrsr.sk into probe/ for parser calibration.
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt
      - run: python scraper/probe.py
      - name: Commit samples
        run: |
          git config user.name "faktickapoznamka-bot"
          git config user.email "bot@faktickapoznamka.sk"
          git add probe
          git diff --cached --quiet || (git commit -m "probe: nrsr.sk samples" && git push)
