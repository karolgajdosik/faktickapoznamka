name: Update data and deploy
on:
  schedule:
    # Hourly on weekdays 7–20 UTC, once a day otherwise. GitHub cron may run late.
    - cron: "23 7-20 * * 1-5"
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Scan all sessions of the term (backfill)"
        type: boolean
        default: false
      speech_minutes:
        description: "Time budget for debate transcripts (minutes)"
        required: false
        default: "25"
      refetch:
        description: "Old vote pages to re-read (clubs, detail)"
        required: false
        default: "300"
      extra_minutes:
        description: "Time budget for MP activity, committees, laws, declarations (minutes)"
        required: false
        default: "12"
      max:
        description: "Max votes in this run"
        required: false
        default: "400"
permissions: { contents: write, models: read, issues: write }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Scrape
        env:
          IN_MAX: ${{ inputs.max || '400' }}
          IN_ALL: ${{ inputs.all && 'true' || 'false' }}
          IN_SPEECH: ${{ inputs.speech_minutes || '25' }}
          IN_REFETCH: ${{ inputs.refetch || '300' }}
        run: |
          for v in "$IN_MAX" "$IN_SPEECH" "$IN_REFETCH"; do [[ "$v" =~ ^[0-9]+$ ]] || { echo "invalid numeric input"; exit 1; }; done
          ALL=""; [ "$IN_ALL" = "true" ] && ALL="--all"
          pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
          python scraper/test_parse.py
          timeout 320m python scraper/run.py --max "$IN_MAX" $ALL --speech-minutes "$IN_SPEECH" --refetch "$IN_REFETCH" || echo "scraper stopped early, committing progress"
      - name: Extra data (activity, committees, laws, declarations)
        env:
          IN_EXTRA: ${{ inputs.extra_minutes || '12' }}
        run: |
          [[ "$IN_EXTRA" =~ ^[0-9]+$ ]] || { echo "invalid numeric input"; exit 1; }
          python scraper/test_parse_extra.py > /dev/null
          timeout 300m python scraper/extra.py --minutes "$IN_EXTRA" || echo "extra scraper stopped early, committing progress"
      - name: Explanatory memoranda of bills (text for law summaries)
        continue-on-error: true
        run: timeout 15m python scraper/lawdocs.py --minutes 10 --max 60
      - name: AI summaries (GitHub Models)
        continue-on-error: true
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: timeout 20m python scraper/summarize.py
      - name: Commit data
        id: commit
        run: |
          git config user.name "faktickapoznamka-bot"
          git config user.email "bot@faktickapoznamka.sk"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -q -m "data: $(date -u +%F\ %H:%M)"
            # a code push can land at the same moment; retry the rebase + push a few times
            for i in 1 2 3 4; do git pull --rebase -X theirs -q origin main && git push -q && break; echo "push retry $i"; sleep $((i * 15)); done
            git status -sb | grep -q ahead && { echo "push failed"; exit 1; }
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Cache share images
        if: steps.commit.outputs.changed == 'true'
        uses: actions/cache@v4
        with:
          path: .og-cache
          key: og-${{ github.run_id }}
          restore-keys: og-
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
        timeout-minutes: 40
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Data watchdog
        # Opens (or updates) an issue when the scraper silently stops producing data; GitHub e-mails the repo owner. Closes it once data flows again.
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set +e
          python scraper/watchdog.py > watchdog.md; rc=$?
          cat watchdog.md
          gh label create watchdog --color B60205 --description "Strážca dát" 2>/dev/null
          open=$(gh issue list --label watchdog --state open --json number -q '.[0].number')
          if [ $rc -ne 0 ]; then
            if [ -z "$open" ]; then gh issue create --title "Strážca dát: scraper neprináša nové dáta" --label watchdog --body-file watchdog.md
            elif [ "$(date -u +%H)" = "07" ]; then gh issue comment "$open" --body-file watchdog.md; fi
            exit 1
          elif [ -n "$open" ]; then gh issue close "$open" --comment "Dáta opäť pribúdajú: $(cat watchdog.md)"; fi
