name: Update data and deploy
on:
  schedule:
    # Hourly on weekdays 7–20 UTC, once a day otherwise. GitHub cron may run late.
    - cron: "23 7-20 * * 1-5"
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "Start vote ID (first run only)"
        required: false
  push:
    branches: [main]
    paths-ignore: ["data/**", "probe/**", "**.md"]
permissions: { contents: write }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Scrape
        if: github.event_name != 'push'
        run: |
          pip install -r scraper/requirements.txt
          python scraper/test_parse.py
          python scraper/run.py ${{ inputs.start && format('--start {0}', inputs.start) || '' }}
      - name: Commit data
        id: commit
        if: github.event_name != 'push'
        run: |
          git config user.name "faktickapoznamka-bot"
          git config user.email "bot@faktickapoznamka.sk"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT
          else git commit -m "data: $(date -u +%F\ %H:%M)" && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
      - name: Build
        if: github.event_name == 'push' || steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
      - name: Deploy to Cloudflare
        if: (github.event_name == 'push' || steps.commit.outputs.changed == 'true') && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
