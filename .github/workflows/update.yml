name: Update data and deploy
on:
  schedule:
    # Hourly on weekdays 7–20 UTC, once a day otherwise. GitHub cron may run late.
    - cron: "23 7-20 * * 1-5"
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: "Scan all sessions of the term (backfill)"
        type: boolean
        default: false
      speech_minutes:
        description: "Time budget for debate transcripts (minutes)"
        required: false
        default: "25"
      max:
        description: "Max votes in this run"
        required: false
        default: "400"
permissions: { contents: write }
concurrency: { group: update, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Scrape
        run: |
          pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
          python scraper/test_parse.py
          timeout 320m python scraper/run.py --max ${{ inputs.max || 400 }} ${{ inputs.all && '--all' || '' }} --speech-minutes ${{ inputs.speech_minutes || 25 }} || echo "scraper stopped early, committing progress"
      - name: Commit data
        id: commit
        run: |
          git config user.name "faktickapoznamka-bot"
          git config user.email "bot@faktickapoznamka.sk"
          git add data
          if git diff --cached --quiet; then echo "changed=false" >> $GITHUB_OUTPUT
          else git commit -m "data: $(date -u +%F\ %H:%M)" && git pull --rebase -X theirs -q origin main && git push && echo "changed=true" >> $GITHUB_OUTPUT; fi
      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm ci && npm run build
      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true' && env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
