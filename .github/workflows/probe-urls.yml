name: Probe URLs
on:
  workflow_dispatch:
    inputs:
      urls: { description: "name=URL pairs separated by spaces", required: true }
      follow: { description: "regex of links to follow (optional)", required: false, default: "" }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - run: python scraper/probe_urls.py ${{ inputs.urls }}
        env: { FOLLOW: "${{ inputs.follow }}" }
      - run: |
          git config user.name "faktickapoznamka-bot"; git config user.email "bot@faktickapoznamka.sk"
          git add probe; git diff --cached --quiet || (git commit -m "probe: urls" && git pull --rebase -q origin main && git push)
