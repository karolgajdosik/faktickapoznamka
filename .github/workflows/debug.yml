name: Debug script
on:
  workflow_dispatch:
    inputs:
      script: { description: "scraper/debug_*.py file name", required: true, default: "debug_paginate.py" }
      args: { description: "arguments", required: false, default: "" }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r scraper/requirements.txt && python -m playwright install --with-deps chromium
      - name: Run
        env: { SCRIPT: "${{ inputs.script }}", ARGS: "${{ inputs.args }}" }
        run: |
          case "$SCRIPT" in debug_*.py) ;; *) echo "only debug_*.py"; exit 1;; esac
          python "scraper/$SCRIPT" $ARGS
      - run: |
          git config user.name "faktickapoznamka-bot"; git config user.email "bot@faktickapoznamka.sk"
          git add probe; git diff --cached --quiet || (git commit -m "debug: samples" && git pull --rebase -X theirs -q origin main && git push)
