name: Import fotografii PolitiCheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests pillow

      - name: Download photos
        run: |
          python <<'PY'
          import requests, re, pathlib, io, time
          from PIL import Image

          base = "https://politicheck.sk"
          session = requests.Session()
          photos = {}

          for page in range(1, 9):
              r = session.get(
                  base + "/politici",
                  params={"strana": page},
                  timeout=60)
              r.raise_for_status()

              paths = re.findall(
                  r"/api/media/members/(\d+)/([a-zA-Z0-9_-]+\.jpg)",
                  r.text)

              for i, filename in paths:
                  photos[i] = (
                      f"{base}/api/media/members/{i}/{filename}"
                  )

              print("Page", page, "Total:", len(photos))
              time.sleep(1)

          out = pathlib.Path("fotografie")
          out.mkdir(exist_ok=True)

          for i, url in photos.items():
              try:
                  r = session.get(url, timeout=30)
                  r.raise_for_status()
                  img = Image.open(io.BytesIO(r.content))
                  if img.format != "JPEG":
                      continue
                  img.verify()
                  (out / f"{i}.jpg").write_bytes(r.content)
                  print("OK:", i)
              except Exception as e:
                  print("ERROR:", i, str(e))
              time.sleep(0.3)

          count = len(list(out.glob("*.jpg")))
          print("TOTAL JPG:", count)

          if count == 0:
              raise RuntimeError("No photos downloaded")
          PY

      - name: Create ZIP
        uses: actions/upload-artifact@v4
        with:
          name: poslanci-NRSR
          path: fotografie/*.jpg
          retention-days: 7
