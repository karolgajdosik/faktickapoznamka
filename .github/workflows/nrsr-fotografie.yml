name: Test dostupnosti fotografii NR SR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: pip install requests pillow

      - name: Test JPG
        run: |
          python <<'PY'
          import requests
          import io
          from PIL import Image

          ids = [1207, 1187, 997]
          success = 0

          for i in ids:
              for path in [
                  "/web/dynamic/PoslanecPhoto.aspx",
                  "/dynamic/PoslanecPhoto.aspx"
              ]:
                  try:
                      r = requests.get(
                          "https://www.nrsr.sk" + path,
                          params={"PoslanecID": i},
                          timeout=30
                      )

                      print(i, r.status_code,
                            r.headers.get("Content-Type"))

                      r.raise_for_status()
                      img = Image.open(io.BytesIO(r.content))
                      print("IMAGE:", img.format, img.size)
                      img.verify()

                      if img.format == "JPEG":
                          success += 1
                          break

                  except Exception as e:
                      print("ERROR:", str(e))

          print("SUCCESS:", success, "/ 3")

          if success != 3:
              raise RuntimeError("Photo source unavailable")
          PY
