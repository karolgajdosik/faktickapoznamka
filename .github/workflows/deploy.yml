name: Deploy
# Code changes (and manual runs) deploy straight away; data changes deploy from update.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["data/**", "probe/**", "**.md", "scraper/**"]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build
      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Missing secrets
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN not set, skipping deploy"
